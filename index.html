<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="הזמנה לברית מילה ואישור הגעה">
  <title>הזמנה לברית מילה</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/invitation.css?v=20261115-3">
  <script type="module" src="./assets/guest.js?v=20261115-3"></script>
</head>
<body class="invitation-page">
  <main class="invitation" id="top">
    <div class="invitation-content">
      <header class="invitation-header">
        <span class="bsd">בס״ד</span>
        <p class="blessing">בשם ה׳ נעשה ונצליח</p>
      </header>

      <section class="intro" aria-labelledby="eventTitle">
        <div class="intro-copy">
          <p class="intro-kicker">הננו מתכבדים להזמינכם</p>
          <h1 id="eventTitle">הזמנה לברית המילה</h1>
          <p id="eventSubtitle" class="intro-subtitle">של בננו היקר</p>
          <p class="intro-message">נשמח לארח אתכם בשמחתנו</p>
        </div>
        <figure class="intro-photo">
          <img src="./assets/ceremony-hero.webp" alt="טלית, גביע כסף וסידור לברית המילה" width="620" height="810" loading="eager">
        </figure>
      </section>

      <section class="event-information" aria-label="מועד ומקום האירוע">
        <div class="event-facts">
          <div class="event-fact">
            <span class="fact-label">תאריך</span>
            <strong id="eventDate" class="fact-value">—</strong>
          </div>
          <div class="event-fact">
            <span class="fact-label">שעת התחלה</span>
            <strong id="eventTime" class="fact-value time-value" dir="ltr">15:00</strong>
          </div>
        </div>
        <div class="venue-row">
          <div class="venue-copy">
            <span class="fact-label">מיקום</span>
            <strong id="eventVenue" class="venue-name">—</strong>
            <span id="eventAddress" class="venue-address" hidden></span>
          </div>
          <a id="eventMapLink" class="map-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
            <span>ניווט למקום</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </a>
        </div>
      </section>

      <section id="rsvpSection" class="rsvp-section" aria-labelledby="rsvpHeading">
        <div class="rsvp-head">
          <h2 id="rsvpHeading">אישור הגעה</h2>
        </div>
        <p id="configAlert" class="form-message form-error" role="alert" hidden>לא ניתן להתחבר למערכת כרגע. נא לפנות למארגנים.</p>
        <form id="rsvpForm" class="rsvp-form" novalidate>
          <div class="form-fields">
            <div class="field">
              <label for="firstName">שם פרטי</label>
              <input id="firstName" name="firstName" type="text" autocomplete="given-name" minlength="2" maxlength="40" placeholder="שם פרטי" required>
            </div>
            <div class="field">
              <label for="lastName">שם משפחה</label>
              <input id="lastName" name="lastName" type="text" autocomplete="family-name" minlength="2" maxlength="40" placeholder="שם משפחה" required>
            </div>
            <div class="field guest-count-field">
              <label for="guests">מספר מגיעים</label>
              <div class="guests-stepper">
                <button type="button" id="minusGuests" aria-label="הפחת אורח">−</button>
                <input id="guests" name="guests" type="number" min="1" max="20" inputmode="numeric" value="1" required>
                <button type="button" id="plusGuests" aria-label="הוסף אורח">+</button>
              </div>
            </div>
          </div>
          <div class="spam-trap" aria-hidden="true"><label for="website">אתר אישי</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
          <p id="formError" class="form-message form-error" role="alert" hidden></p>
          <button id="submitRsvp" type="submit" class="submit-button"><span class="button-text">שליחת אישור הגעה</span><span aria-hidden="true">←</span></button>
        </form>
        <div id="successPanel" class="success-panel" role="status" aria-live="polite" hidden>
          <span class="success-check" aria-hidden="true">✓</span>
          <h3>האישור התקבל</h3>
          <p id="successName"></p>
          <p id="successCount"></p>
        </div>
      </section>
    </div>
  </main>

  <a id="scrollToRsvp" class="floating-rsvp" href="#rsvpSection" aria-label="גלילה לאישור הגעה"><span>לאישור הגעה</span><span class="floating-arrow" aria-hidden="true">↓</span></a>

  <div id="thanksOverlay" class="thanks-overlay" hidden>
    <section class="thanks-dialog" role="dialog" aria-modal="true" aria-labelledby="thanksTitle" aria-describedby="thanksDescription" tabindex="-1">
      <span class="thanks-check" aria-hidden="true">✓</span>
      <h2 id="thanksTitle">האישור התקבל</h2>
      <p id="thanksDescription">תודה על אישור ההגעה.</p>
      <p id="thanksSummary" class="thanks-summary"></p>
      <button id="thanksCloseButton" class="close-thanks" type="button">סגירה</button>
    </section>
  </div>
</body>
</html>
